# KWin and powerdevil look for the accelerometer and light sensor only when the
# session starts. The sensors come from the SLPI via hexagonrpcd and appear
# ~10 s after the session would otherwise start, so wait for them (at most
# 20 s; the session still starts if they never show up).
[Unit]
Wants=hexagonrpcd-sdsp.service iio-sensor-proxy.service
After=hexagonrpcd-sdsp.service iio-sensor-proxy.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 20); do busctl get-property net.hadess.SensorProxy /net/hadess/SensorProxy net.hadess.SensorProxy HasAccelerometer 2>/dev/null | grep -q true && exit 0; sleep 1; done; exit 0'
