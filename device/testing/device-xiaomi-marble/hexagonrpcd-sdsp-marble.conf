# The SLPI (sensor DSP) creates /dev/fastrpc-sdsp only after this unit is
# checked at boot. Wait for the node instead of skipping the unit, and give
# hexagonrpcd a moment to serve the sensor registry before iio-sensor-proxy
# (ordered after this unit) looks for sensors.
[Unit]
ConditionPathExists=

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 60); do [ -e /dev/fastrpc-sdsp ] && exit 0; sleep 1; done; exit 1'
ExecStartPost=/bin/sleep 10
